<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">Three dedicated Ubuntu Minecraft hosts</title><desc id="desc">Players connect through DNS and a home router to Bedrock on a Lenovo M710q, ATM10 on a Lenovo M720q, and Paper on an HP ProDesk 600 G2. SSH administration stays on the LAN.</desc>
<rect width="1200" height="580" rx="20" fill="#0b1220"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="54" fill="#7dd3fc" font-size="14" letter-spacing="3">MY MINECRAFT SERVERS</text><text x="48" y="99" fill="#f8fafc" font-size="34" font-weight="700">Bedrock, ATM10, and Paper on Ubuntu.</text>
<text x="48" y="129" fill="#94a3b8" font-size="16">Two Lenovo mini PCs and an HP desktop, each running its own server.</text>
<rect x="48" y="168" width="260" height="74" rx="12" fill="#172338" stroke="#34465e"/><text x="72" y="199" fill="#f8fafc" font-size="18" font-weight="600">Minecraft players</text><text x="72" y="224" fill="#aabbd0" font-size="14">DNS lookup + game connection</text>
<path d="M308 205H426" stroke="#64748b" stroke-width="2"/><path d="m419 200 7 5-7 5" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="426" y="168" width="350" height="74" rx="12" fill="#172338" stroke="#34465e"/><text x="450" y="199" fill="#f8fafc" font-size="18" font-weight="600">TELUS home router / NAT</text><text x="450" y="224" fill="#aabbd0" font-size="14">Game ports forwarded to the intended host</text>
<rect x="850" y="168" width="302" height="74" rx="12" fill="#172338" stroke="#34465e"/><text x="874" y="199" fill="#f8fafc" font-size="18" font-weight="600">LAN administration</text><text x="874" y="224" fill="#aabbd0" font-size="14">SSH • systemctl • journalctl</text>
<path d="M600 242V280M230 280H970M230 280V312M600 280V312M970 280V312" stroke="#64748b" stroke-width="2" fill="none"/>
<g><rect x="48" y="312" width="350" height="190" rx="14" fill="#132e2b" stroke="#2c7662"/><text x="72" y="347" fill="#6ee7b7" font-size="14" letter-spacing="2">BEDROCK</text><text x="72" y="380" fill="#f8fafc" font-size="22" font-weight="700">Lenovo ThinkCentre M710q</text><text x="72" y="411" fill="#cbd5e1" font-size="16">i5-7500T · 16 GB DDR4</text><text x="72" y="437" fill="#cbd5e1" font-size="16">120 GB NVMe · Ubuntu Server</text><text x="72" y="475" fill="#6ee7b7" font-size="16">UDP 19132</text></g>
<g><rect x="425" y="312" width="350" height="190" rx="14" fill="#192a45" stroke="#365f96"/><text x="449" y="347" fill="#93c5fd" font-size="14" letter-spacing="2">ALL THE MODS 10</text><text x="449" y="380" fill="#f8fafc" font-size="22" font-weight="700">Lenovo ThinkCentre M720q</text><text x="449" y="411" fill="#cbd5e1" font-size="16">i5-8500T · 16 GB DDR4</text><text x="449" y="437" fill="#cbd5e1" font-size="16">128 GB NVMe · Java 21 / NeoForge</text><text x="449" y="475" fill="#93c5fd" font-size="16">TCP 25565</text></g>
<g><rect x="802" y="312" width="350" height="190" rx="14" fill="#30263e" stroke="#70588b"/><text x="826" y="347" fill="#d8b4fe" font-size="14" letter-spacing="2">PAPER</text><text x="826" y="380" fill="#f8fafc" font-size="22" font-weight="700">HP ProDesk 600 G2 SFF</text><text x="826" y="411" fill="#cbd5e1" font-size="16">i5-6500 · 16 GB DDR4</text><text x="826" y="437" fill="#cbd5e1" font-size="16">240 GB SSD · Ubuntu Server</text><text x="826" y="475" fill="#d8b4fe" font-size="16">TCP 25555 · DNS SRV</text></g>
<text x="48" y="546" fill="#94a3b8" font-size="14">Game ports and host assignments from my setup notes. SSH administration stays on the LAN.</text></g></svg>
